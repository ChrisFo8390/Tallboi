
[board_pins fly]
mcu: fly
aliases:
    # Driver slots (STEP/DIR/EN/UART-CS/STOP)
    D0_EN=PC2,   D0_STEP=PC15,  D0_DIR=PC14,  D0_CS=PC13, D0_STOP=PB4,   # lane0
    D1_EN=PA2,   D1_STEP=PA1,   D1_DIR=PA0,   D1_CS=PC3,  D1_STOP=PB3,   # lane1
    D2_EN=PA6,   D2_STEP=PA5,   D2_DIR=PA4,   D2_CS=PA3,  D2_STOP=PD2,   # lane2
    D3_EN=PB0,   D3_STEP=PC5,   D3_DIR=PC4,   D3_CS=PA7,  D3_STOP=PB5,   # lane3
    D4_EN=PB11,  D4_STEP=PB10,  D4_DIR=PB2,   D4_CS=PB1,                 # lane4 (no STOP pin available!)

    # Heaters/thermistors/fans (presumably unused on the EMU,
    # can be used as spare GPIOs for sensors if needed)
    BED_OUT=PC7, HEAT0=PC6, BED_TEMP=PC0, HEAT0_TEMP=PC1,
    FAN0=PC8, FAN1=PC9,

    # EXP1/EXP2 header (no display/buttons installed ->
    # usable as extra free GPIOs for PSF sensors)
    EXP1_2=PA15, EXP1_4=PA14, EXP1_6=PA13, EXP1_3=PC11, EXP1_5=PC10,
    EXP2_1=PB14, EXP2_3=PC12, EXP2_5=PB6,  EXP2_7=PB7,  EXP2_2=PB13, EXP2_4=PB12, EXP2_6=PB15
