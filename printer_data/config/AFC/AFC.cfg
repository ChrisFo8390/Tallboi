#--=================================================================================-
#------- Local includes ---------------------------------------------------------------
#--=================================================================================-
[include AFC_Macro_Vars.cfg]
[include AFC_Hardware.cfg]
[include AFC_EMU.cfg]
[include mcu/EMU_board.cfg]

# ============================================================
# AFC.cfg
# ============================================================

[AFC]
VarFile: /home/pi/printer_data/config/AFC/AFC.var   # Path to the variables file

#--=================================================================================-
#------- Speed ----------------------------------------------------------------------
#--=================================================================================-
long_moves_speed: 150           # mm/s
long_moves_accel: 250           # mm/s^2
short_moves_speed: 50           # mm/s
short_moves_accel: 300          # mm/s^2
short_move_dis: 10              # mm

enable_sensors_in_gui: True     # Show prep/load sensors as filament sensors in Mainsail/Fluidd
load_to_hub: True                # Automatically advance to the load sensor when filament is inserted
assisted_unload: False
debounce_delay: 1

#--=================================================================================-
#------- LED Settings ----------------------------------------------------------------
#--=================================================================================-
# Values are R,G,B,W (0-1 each). VERIFY against the [neopixel AFC_Indicator]
# color_order in AFC_EMU.cfg - if your strip is plain RGB (3 channel),
# drop the trailing W value here too.
led_name: AFC_Indicator          # Must match the [neopixel ...] name in AFC_EMU.cfg
led_fault: 1,0,0,0               # Fault color
led_ready: 0.5,0.5,0.5,0         # Standby -> white at half brightness, as requested
led_not_ready: 1,0,0,0           # Not ready / error color
led_loading: 1,1,0,0             # Actively loading/unloading
led_tool_loaded: 0,0,1,0         # This lane is currently loaded to its toolhead
led_buffer_advancing: 0,0,1,0
led_buffer_trailing: 0,1,0,0
led_buffer_disable: 0,0,0,0.25
led_spool_illuminate: 1,1,1,0

debug: False                     # Set to True if you need more console output

#--=================================================================================-
#------- Pause/Resume ---------------------------------------------------------------
#--=================================================================================-
z_hop: 10                        # Height to raise before/after a toolchange
resume_speed: 200
resume_z_speed: 50
error_timeout: 36000

#--=================================================================================-
#------- Macro Config (currently DISABLED - no cutter/purge/park routine set up yet)
#--=================================================================================-
# Once you have a cut/poop/kick/park/wipe routine set up, enable the
# corresponding flags here (tool_cut/poop/kick/park/wipe: True) and set
# each <..._cmd> to your actual macro name.
tool_cut: False
park: False
poop: True
kick: False
wipe: True
form_tip: False

#--=================================================================================-
#------- Start-up -------------------------------------------------------------------
#--=================================================================================-
[AFC_prep]
enable: True                     # Run the PREP routine on Klipper startup

[delayed_gcode afc_welcome]
initial_duration: 2
gcode:
    AFC_LED_WELCOME
    PREP

[AFC_form_tip]
# Minimal defaults, since form_tip is disabled above. Adjust later to
# match your hotend/cutter geometry if needed.
ramming_volume: 0
toolchange_temp: 0
unloading_speed_start: 40
unloading_speed: 15
cooling_tube_position: 35
cooling_tube_length: 10
initial_cooling_speed: 10
final_cooling_speed: 50
cooling_moves: 4
use_skinnydip: False
skinnydip_distance: 30
dip_insertion_speed: 30
dip_extraction_speed: 70
melt_zone_pause: 0
cooling_zone_pause: 0


