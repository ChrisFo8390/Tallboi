# ============================================================
# AFC_PFS_Test_Macros.cfg
# Simple test macros for the 5 PFS buffer sensors, meant to be
# used as dashboard buttons in HelixScreen (or the Mainsail/
# Fluidd macro list) - no compiling/rebuilding the screen app
# needed.
#
# Each macro calls QUERY_BUFFER for the corresponding lane and
# prints the result directly to the console. That way you can
# check with one tap whether the PFS sensor is reporting values,
# without having to type the buffer name yourself.
# ============================================================

[gcode_macro TEST_PFS_LANE0]
description: Shows the current PFS reading for lane 0 (T0)
gcode:
    RESPOND MSG="--- PFS Test Lane 0 (T0) ---"
    QUERY_BUFFER BUFFER=EMU_buf0

[gcode_macro TEST_PFS_LANE1]
description: Shows the current PFS reading for lane 1 (T1)
gcode:
    RESPOND MSG="--- PFS Test Lane 1 (T1) ---"
    QUERY_BUFFER BUFFER=EMU_buf1

[gcode_macro TEST_PFS_LANE2]
description: Shows the current PFS reading for lane 2 (T2)
gcode:
    RESPOND MSG="--- PFS Test Lane 2 (T2) ---"
    QUERY_BUFFER BUFFER=EMU_buf2

[gcode_macro TEST_PFS_LANE3]
description: Shows the current PFS reading for lane 3 (T3)
gcode:
    RESPOND MSG="--- PFS Test Lane 3 (T3) ---"
    QUERY_BUFFER BUFFER=EMU_buf3

[gcode_macro TEST_PFS_LANE4]
description: Shows the current PFS reading for lane 4 (T4)
gcode:
    RESPOND MSG="--- PFS Test Lane 4 (T4) ---"
    QUERY_BUFFER BUFFER=EMU_buf4

[gcode_macro TEST_PFS_ALL]
description: Shows the PFS readings for all 5 lanes in sequence
gcode:
    RESPOND MSG="=== PFS Test - all lanes ==="
    TEST_PFS_LANE0
    TEST_PFS_LANE1
    TEST_PFS_LANE2
    TEST_PFS_LANE3
    TEST_PFS_LANE4
