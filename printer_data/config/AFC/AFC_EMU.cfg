# ============================================================
# AFC_EMU.cfg
# All 5 lanes connect to ONE board (Fly D5 ("fly")), see
# mcu/EMU_board.cfg for the pin aliases. No LEDs, no buttons.
#
# Direct mode (1 lane -> 1 toolhead), no [AFC_hub] needed,
# but [AFC_buffer] is mandatory -> implemented here as an
# analog FPS_PSF sensor (1 ADC pin per lane instead of a
# digital advance/trailing pair).
#
# STEP/DIR/EN/UART are taken from the official Fly D5 pinout
# and are fixed.
#
# "prep" (before the extruder) and "load" (after the extruder)
# are separate digital Omron D2HW switches (pin 1 = GND,
# pin 2 = I/O -> pull-up + inversion needed: "^!"), hard-wired
# to the following fly pins:
#   lane0: prep=PB7,  load=PC10
#   lane1: prep=PB6,  load=PC11
#   lane2: prep=PC12, load=PA13
#   lane3: prep=PB14, load=PA14
#   lane4: prep=PB13, load=PA15
# NOTE: PA13/PA14/PA15 are normally the STM32's SWD/debug pins -
# repurposed here deliberately as plain GPIO. Keep the SWD pins
# in mind if the board ever needs to be reflashed later.
#
# The 5 PFS sensors (buffer, adc_pin) are NOT on the fly board,
# but on a second board called "hexa", whose [mcu hexa] section
# is already defined elsewhere in printer.cfg (so no separate
# mcu file is needed here):
#   lane0 -> hexa:PB1
#   lane1 -> hexa:PB0
#   lane2 -> hexa:PA7
#   lane3 -> hexa:PA6
#   lane4 -> hexa:PA5
#
# rotation_distance/gear_ratio match the standard values for the
# EMU/BoxTurtle extruder (identical for all 5 lanes).
# ============================================================

[AFC_EMU EMU]
enable_assist: False
enable_kick_start: False

# ---------------------------------------------------------
# Lane 0 -> Toolhead 0 (extruder) | Board Slot D0
# ---------------------------------------------------------
[AFC_stepper lane0]
map: T0
unit: EMU:0
step_pin: fly:D0_STEP
dir_pin: !fly:D0_DIR
enable_pin: !fly:D0_EN
rotation_distance: 53.494165
gear_ratio: 44:10, 37:17
microsteps: 16
dist_hub: 1231.81 
prep: ^fly:PB7  
load: ^fly:PC10  
hub: direct
buffer: EMU_buf0
extruder: extruder
load_to_hub: True

[tmc2209 AFC_stepper lane0]
uart_pin: fly:D0_CS
run_current: 0.6
sense_resistor: 0.110

[AFC_buffer EMU_buf0]
type: FPS_PSF
adc_pin: hexa:PB1
neutral_point: 0.506
max_tension: 0.103
max_compression: 0.909
reversed: false  

# ---------------------------------------------------------
# Lane 1 -> Toolhead 1 (extruder1) | Board Slot D1
