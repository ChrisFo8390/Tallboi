[AFC_stepper lane1]
map: T1
unit: EMU:1
step_pin: fly:D1_STEP
dir_pin: !fly:D1_DIR
enable_pin: !fly:D1_EN
rotation_distance: 53.494165
gear_ratio: 44:10, 37:17
microsteps: 16
dist_hub: 1500.0  
prep: ^fly:PB6  
load: ^fly:PC11  
hub: direct
buffer: EMU_buf1
