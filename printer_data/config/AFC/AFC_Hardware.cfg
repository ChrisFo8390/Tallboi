# ============================================================
# AFC_Hardware.cfg
# Contains:
#  1) The toolchanger unit registration (only needed once)
#  2) One [AFC_extruder] per toolhead (5 total)
#
# "tool:" must exactly match the tool name from your
# klipper-toolchanger toolchanger.cfg (e.g. "tool T0").
#
# pin_tool_start uses the "buffer" ram-sensor feature instead of
# the physical EBB hotend sensor: AFC detects "loaded to toolhead"
# once the lane's FPS_PSF buffer reading crosses homing_high_point
# (default 0.7) after the calibrated dist_hub move, rather than via
# a dedicated MCU pin. See:
# https://www.afcproject.dev/installation/buffer-ram-sensor.html
#
# The original physical sensor pins are kept below as a commented
# reference in case you want to revert to a hardware sensor later.
# ============================================================

[AFC_Toolchanger Tools]

# ---- Toolhead 0 ----
[AFC_extruder extruder]
pin_tool_start: buffer
# pin_tool_start: ^!EBB0: PB6
buffer: EMU_buf0
tool_stn: 60.0
tool_stn_unload: 65.0
tool: tool T0
deadband: 10
toolchanger_unit: Tools

