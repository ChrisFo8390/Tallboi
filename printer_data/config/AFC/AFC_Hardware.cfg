# ============================================================
# AFC_Hardware.cfg
# Contains:
#  1) The toolchanger unit registration (only needed once)
#  2) One [AFC_extruder] per toolhead (5 total)
#
# "tool:" must exactly match the tool name from your
# klipper-toolchanger toolchanger.cfg (e.g. "tool T0").
# ============================================================

[AFC_Toolchanger Tools]

# ---- Toolhead 0 ----
[AFC_extruder extruder]
pin_tool_start: ^!EBB0: PB6
tool_stn: 60.0
tool_stn_unload: 65.0
tool: tool T0
deadband: 10
toolchanger_unit: Tools

