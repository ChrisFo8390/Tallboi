[include mcu/emu_1.cfg]

[mcu emu_1_lane1]
canbus_uuid: <replace with your can UUID>
#canbus_interface: can1         # Uncomment if using a CAN bus other than can0
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[AFC_EMU emu_1]
hub: emu_1_HUB
extruder: extruder
buffer: emu_1_buffer
# The following speeds below are conservative, speeds have been tested up to 500mm/s, recommended
# running speeds at 400mm/s or less.
long_moves_speed: 250
long_moves_accel: 120
#long_moves_speed: 300
#long_moves_accel: 300

[AFC_stepper lane1]
unit: emu_1:1
step_pin: emu_1_lane1:MOT_STEP
dir_pin: emu_1_lane1:MOT_DIR
enable_pin: !emu_1_lane1:MOT_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 2000
led_index: emu_1_Indicator_Button_1:1-4
led_spool_index: emu_1_Indicator_Box_1:1
# If using EBB board comment out the above led_index and led_spool_index and
# uncomment the indexes below. Then comment out both [AFC_led emu_1_Indicator_Button_1]
# and [AFC_led emu_1_Indicator_Box_1] configuration sections and uncomment
# [AFC_led emu_1_Indicator_1].
#led_index: emu_1_Indicator_1:1
#led_spool_index: emu_1_Indicator_1:2
prep: ^!emu_1_lane1:TRG
load: ^emu_1_lane1:LOAD
print_current: 0.4

[tmc2209 AFC_stepper lane1]
uart_pin: emu_1_lane1:MOT_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane1]
pin: ^!emu_1_lane1:BUTTON

[temperature_sensor lane1]
sensor_type: BME280
i2c_address: 118
# If using AHT20 sensor, comment out sensor_type and i2c_address above and uncomment
# the lines below
#sensor_type: AHT2X
#i2c_address: 56
i2c_mcu: emu_1_lane1
i2c_software_scl_pin: emu_1_lane1:TEMP_SW_SCL
i2c_software_sda_pin: emu_1_lane1:TEMP_SW_SCA
# If using hardware I2C instead of software I2C, comment out software SCL/SDA pins
# and uncomment i2c_bus below
#i2c_bus: i2c2_PB10_PB11

[temperature_sensor emu_1_mcu_lane1]
sensor_type: temperature_mcu
sensor_mcu: emu_1_lane1

[controller_fan emu_1_fan_lane1]
pin: emu_1_lane1:FAN
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane1

# Based on your configuration, LED configuration must be selected from the below:

############### EBB + LED PCB ###############

#[AFC_led emu_1_Indicator_1]
#pin: emu_1_lane1:RGB
#chain_count: 5
#color_order: GRBW
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0
#initial_WHITE: 0.0

############### EBB + neopixel eject buttons ###############

#[AFC_led emu_1_Indicator_1]
#pin: emu_1_lane1:RGB
#chain_count: 2
#color_order: GRBW
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0
#initial_WHITE: 0.0

############### SLB + LED PCB ###############

[AFC_led emu_1_Indicator_Button_1]
pin: emu_1_lane1:RGB_button
chain_count: 4
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[AFC_led emu_1_Indicator_Box_1]
pin: emu_1_lane1:RGB_box
chain_count: 1
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[AFC_buffer emu_1_buffer]
advance_pin: ^emu_1_lane1:BUFFER_ADV
trailing_pin: ^emu_1_lane1:BUFFER_TRL
multiplier_high: 1.15
multiplier_low: 0.90

# EMU hub defaults to virtual (no sensor). To use a physical hub sensor:
#  - Replace "virtual" with the actual sensor pin
#  - Update dist_hub in each AFC_stepper section to the PTFE length between
#    the load sensor and hub sensor
#  - Remove/comment out the `use_dist_hub: True` line
[AFC_hub emu_1_HUB]
afc_bowden_length: 2000
hub_clear_move_dis: 5
switch_pin: virtual
use_dist_hub: True
