# UKAM mcus.ini für den Tallboi, abgeleitet aus der printer.cfg.
# Ziel auf dem Pi: ~/printer_data/config/ukam/mcus.ini

# --- fly (USB, Katapult mit 8 KiB Offset) ---

[fly]
klipper_section: mcu fly
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-Klipper_stm32f072xb_380043001057475030383720-if00
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32f072xb_380043001057475030383720-if00

# --- EBB0 bis EBB4: baugleich, CAN, Katapult, eine gemeinsame menuconfig (config.EBB0) ---

[EBB0]
klipper_section: mcu EBB0
quiet_command: enter_bootloader -u 26234199a9b3
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -u 26234199a9b3

[EBB1]
klipper_section: mcu EBB1
config_name: EBB0
quiet_command: enter_bootloader -u d9dac70e68b6
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -u d9dac70e68b6

[EBB2]
klipper_section: mcu EBB2
config_name: EBB0
quiet_command: enter_bootloader -u cd88b192997d
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -u cd88b192997d

[EBB3]
klipper_section: mcu EBB3
config_name: EBB0
quiet_command: enter_bootloader -u d1d0473c408e
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -u d1d0473c408e

[EBB4]
klipper_section: mcu EBB4
config_name: EBB0
quiet_command: enter_bootloader -u 0ad81eb71468
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -u 0ad81eb71468

