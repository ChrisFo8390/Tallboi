#####################################################################
# 	LED Effects for Chamber an Toolheads
#####################################################################

[neopixel _Chamber]
pin: PB10
chain_count: 18
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0

[led_effect light_start]
autostart: false
frame_rate: 24
leds:
    neopixel:_Chamber
     
layers:
    static 0.00 0.00 lighten (1.00,0.50,0.00) 
    chase 0.20 0.20 top (1.00,1.00,1.00) 

[led_effect critical_error]
leds:
    neopixel:_Chamber
    
layers:
    strobe         1  1.5   add        (1.0,  1.0, 1.0)
    breathing      2  0     difference (0.95, 0.0, 0.0)
    static         1  0     top        (1.0,  0.0, 0.0)
autostart:                             false
frame_rate:                            24
run_on_error:                          true

#####################################################################
# 	LED Toolhead 0
#####################################################################


[gcode_macro _TOOLHEAD_LED]
gcode: 
    SET_LED LED=_logo_led0 RED=0 GREEN=0 BLUE=0 WHITE=0.8 INDEX=2 TRANSMIT=1
