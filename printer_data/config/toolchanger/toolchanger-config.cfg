#####################################################################
# 	Toolchanger-Config
#####################################################################

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[force_move]
enable_force_move: True

[toolchanger]
params_dropoff_path: [{'y':9.5 ,'z':5}, {'y':9.5, 'z':5}, {'y':0, 'z':5}, {'z':0, 'y':0, 'f':0.7}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.7, 'verify':1}, {'y':0, 'z':5}, {'y':9.5, 'z':5}, {'y':9.5 ,'z':5}]
#params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_y: 100
params_close_y: 22.6
params_fast_speed: 13200 # Go as fast as we can
params_path_speed: 1500 # 20mm/s for the actual change
require_tool_present: False # can set to False if using Beacon/Cartographer/Eddy for Z probe.

# Replaces the stock 'error_gcode: PAUSE' (see _TOOLCHANGE_ERROR at the end of this file)
error_gcode:
    {% if pickup_tool is defined %}
        _TOOLCHANGE_ERROR INSIDE=1 PICKUP={pickup_tool.tool_number if pickup_tool else -1}
    {% else %}
        _TOOLCHANGE_ERROR INSIDE=0
    {% endif %}

#[gcode_macro homing_override_config]
#variable_sensorless_x: True
#variable_sensorless_y: True
#variable_homing_rebound_y: 60 # for sensorless you probably want this set to 20.
#variable_stepper_driver: "tmc2240"
#variable_homing_current: 0.6

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 2.0

#these values need to be set to match the location of your Calibration Switch
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 204.9593
variable_y: -8.9656
variable_z: 8.5781
gcode:

[tools_calibrate]
pin:   PG11
travel_speed: 20  # mms to travel sideways for XY probing
spread: 7  # mms to travel down from top for XY probing
lower_z: 1.0  # The speed (in mm/sec) to move tools down onto the probe
speed: 2  # The speed (in mm/sec) to retract between probes
lift_speed: 4  # Z Lift after probing done, should be greater than any Z variance between tools
final_lift_z: 6 
sample_retract_dist:2
samples_tolerance:0.05
samples:5
samples_result: median # median, average
# Settings for nozzle probe calibration - optional.
#probe: probe # name of the nozzle probe to use
#trigger_to_bottom_z: 0.25 # Offset from probe trigger to vertical motion bottoms out. 
# decrease if the nozzle is too high, increase if too low.

# Error handling of a failed pickup or dropoff (the toolchanger's error_gcode)
#
# The stock error_gcode is a plain PAUSE. Here PAUSE ends in _TOOLHEAD_PARK_PAUSE_CANCEL: a Z lift of only
# custom_park_dz (1 mm) and then ONE diagonal G1 to custom_park_x/y at 100 mm/s. If the verify at the lock position
# of a dock fails ("No tool detected") the shuttle still is inside the dock, and that diagonal move tore T1 out of
# its dock (24.10.2026, AFC.log 21:44:40: [75.5, -29.7, 266.304] -> [50.0, 100.0, 267.255]).
#
# _TOOLCHANGE_ERROR leaves the dock along the dock's own path instead and then pauses WITHOUT any park move:
#   pickup,  tool not detected, shuttle at or before the lock waypoint -> walk the pickup path backwards
#            (release the tool, leave at the low height) and go to params_safe_y
#   pickup,  tool detected, at or behind the lock waypoint              -> continue the exit of the pickup path
#   dropoff, tool still detected, before the release waypoint           -> walk the dropoff path backwards (tool stays)
#   dropoff, tool not detected, at or behind the release waypoint       -> continue the exit of the dropoff path
#   anything else (not near a waypoint, state unclear)                  -> no move at all
# Errors outside of a tool change (INSIDE=0) keep the plain PAUSE.
# While a DOCK_AUTOTUNE scan runs (printer.dock_autotune.active) the shuttle still leaves the dock the same way,
# but there is no message and no pause: the scan goes on with the next trial.
[gcode_macro _TOOLCHANGE_ERROR]
description: error_gcode of the toolchanger. Waits for the machine, then _TOOLCHANGE_ERROR_MOVE decides what is safe
gcode:
    M400
    G4 P300
    _TOOLCHANGE_ERROR_MOVE {rawparams}

[gcode_macro _TOOLCHANGE_ERROR_MOVE]
description: Leave the dock along its own path after a failed pickup or dropoff, then pause without a park move
variable_tolerance: 2.5
gcode:
    {% set tc = printer.toolchanger %}
    {% set inside = params.INSIDE|default(0)|int == 1 %}
    {% set pickup = params.PICKUP|default(-1)|int %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set cx = gp.x|float %}
    {% set cy = gp.y|float %}
    {% set cz = gp.z|float %}
    {% set st = namespace(mode='none', phase='-', k=-1, d=0.0, x=cx, y=cy, z=cz) %}
    {% set orig_dz = printer['gcode_macro _CLIENT_VARIABLE'].custom_park_dz|default(1.0)|float %}
    {% set wp = [] %}
    {% set tool = none %}
    {% set scanning = 'dock_autotune' in printer and printer.dock_autotune.active %}
    {% if inside and tc.tool %}
        {% set tool = printer[tc.tool] %}
        {% set st.phase = 'pickup' if (pickup >= 0 and tc.tool_number|int == pickup) else 'dropoff' %}
        {% set path = tool.params_pickup_path if st.phase == 'pickup' else tool.params_dropoff_path %}
        {% set px = tool.params_park_x|float %}
        {% set py = tool.params_park_y|float %}
        {% set pz = tool.params_park_z|float %}
        {% set last = namespace(x=0.0, y=0.0, z=0.0) %}
        {% for e in path %}
            {% set last.x = e['x']|float if 'x' in e else last.x %}
            {% set last.y = e['y']|float if 'y' in e else last.y %}
            {% set last.z = e['z']|float if 'z' in e else last.z %}
            {% set _ = wp.append({'x': px + last.x, 'y': py + last.y, 'z': pz + last.z, 'f': e['f']|float if 'f' in e else 1.0, 'verify': 'verify' in e}) %}
        {% endfor %}
        {% set best = namespace(i=-1, d=1000000.0) %}
        {% set key = namespace(lock=-1, release=wp|length) %}
        {% for w in wp %}
            {% set d = ((w.x - cx)**2 + (w.y - cy)**2 + (w.z - cz)**2)**0.5 %}
            {% if d < best.d %}
                {% set best.i = loop.index0 %}
                {% set best.d = d %}
            {% endif %}
            {% if w.verify and key.lock < 0 %}
                {% set key.lock = loop.index0 %}
            {% endif %}
            {% if w.z < pz - 1.0 and key.release == wp|length %}
                {% set key.release = loop.index0 %}
            {% endif %}
        {% endfor %}
        {% set st.k = best.i %}
        {% set st.d = best.d %}
        {% set detected = tc.detected_tool_number|int == tool.tool_number|int %}
        {% if st.k >= 0 and st.d <= tolerance %}
            {% if st.phase == 'pickup' and key.lock >= 0 %}
                {% if detected and st.k >= key.lock %}
                    {% set st.mode = 'forward' %}
                {% elif not detected and st.k <= key.lock %}
                    {% set st.mode = 'backward' %}
                {% endif %}
            {% elif st.phase == 'dropoff' %}
                {% if detected and st.k < key.release %}
                    {% set st.mode = 'backward' %}
                {% elif not detected and st.k >= key.release %}
                    {% set st.mode = 'forward' %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% if st.mode != 'none' %}
            G90
            {% if st.mode == 'backward' %}
                {% for j in range(st.k - 1, -1, -1) %}
                    {% set w = wp[j] %}
                    G0 X{w.x|round(3)} Y{w.y|round(3)} Z{w.z|round(3)} F{(tool.params_path_speed|float * wp[j + 1].f)|round(1)}
                    {% set st.x = w.x %}
                    {% set st.y = w.y %}
                    {% set st.z = w.z %}
                {% endfor %}
            {% else %}
                {% for j in range(st.k + 1, wp|length) %}
                    {% set w = wp[j] %}
                    G0 X{w.x|round(3)} Y{w.y|round(3)} Z{w.z|round(3)} F{(tool.params_path_speed|float * w.f)|round(1)}
                    {% set st.x = w.x %}
                    {% set st.y = w.y %}
                    {% set st.z = w.z %}
                {% endfor %}
            {% endif %}
            G0 Y{tool.params_safe_y|float} F{tool.params_fast_speed|float}
            {% set st.y = tool.params_safe_y|float %}
        {% endif %}
        {% if not scanning %}
            RESPOND TYPE=error MSG="Toolchange error at {tool.name} ({st.phase}), nearest path waypoint {st.k} ({st.d|round(2)} mm away), tool {'detected' if detected else 'not detected'}, action: {st.mode}. Check the dock before you continue."
        {% endif %}
    {% elif inside and not scanning %}
        RESPOND TYPE=error MSG="Toolchange error outside of a dock path, no move. Check the machine before you continue."
    {% endif %}
    {% if inside and not scanning %}
        SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_dz VALUE=0.0
        PAUSE X={st.x|round(3)} Y={st.y|round(3)} Z_MIN={st.z|round(3)}
        SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_dz VALUE={orig_dz}
    {% elif not inside %}
        PAUSE
    {% endif %}
