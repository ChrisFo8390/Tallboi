[include main.cfg]
[include macros.cfg]
[include leds.cfg]
[include client.cfg]
[include toolchanger/readonly-configs/toolchanger-include_self.cfg]
[include toolchanger/tools/T0.cfg]
[include toolchanger/tools/T1.cfg]
[include toolchanger/tools/T2.cfg]
[include toolchanger/tools/T3.cfg]
[include toolchanger/tools/T4.cfg]
[include gcode-preprocessor/preprocessor.cfg]
[include dock_tuner.cfg]
[include purge.cfg]

[printer]
kinematics: corexy
max_velocity: 750  
max_accel: 10000             
max_z_velocity: 160 #220
max_z_accel: 350
square_corner_velocity: 6.0

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.5
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 35

[gcode_preprocessor idle_tool_shutdown]
idle_timeout_minutes: 2
initial_feedrate: 3000

[exclude_object]

[idle_timeout]
timeout: 14400

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_080017000C51313339373836-if00
restart_method: command

[mcu cartographer] 
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_3B0046000850525537333120-if00
restart_method: command
is_non_critical: true

[mcu hexa]
canbus_uuid: 10e76e7db8a6

[mcu EBB0]
canbus_uuid: 26234199a9b3

[mcu EBB1]
canbus_uuid: d9dac70e68b6

[mcu EBB2]
canbus_uuid: cd88b192997d

[mcu EBB3]
canbus_uuid: d1d0473c408e

[mcu EBB4]
canbus_uuid: 0ad81eb71468

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor Hexa]
sensor_type: temperature_mcu
sensor_mcu: hexa

[temperature_sensor Host]
sensor_type: temperature_host

[temperature_sensor EBB0]
sensor_type: temperature_mcu
sensor_mcu: EBB0

[temperature_sensor EBB1]
sensor_type: temperature_mcu
sensor_mcu: EBB1

[temperature_sensor EBB2]
sensor_type: temperature_mcu
sensor_mcu: EBB2

[temperature_sensor EBB3]
sensor_type: temperature_mcu
sensor_mcu: EBB3

[temperature_sensor EBB4]
sensor_type: temperature_mcu
sensor_mcu: EBB4

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[temperature_sensor Motor_Z]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4

[temperature_sensor Motor_Z1]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF5

[temperature_sensor Motor_Z2]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF6

[temperature_sensor Motor_Z3]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF7

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 47
verbose: yes 

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin:!PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 302
position_max: 302
homing_speed: 120
second_homing_speed: 80
homing_retract_dist: 20
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_bus: spi1
diag0_pin:^!PG6
interpolate: true
run_current: 1.4
home_current: 0.5
driver_SGT: 1
rref: 12000

[stepper_y]
step_pin: PG0
dir_pin:!PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -32
position_endstop: 280
position_max: 280
homing_speed: 120
second_homing_speed: 80
homing_retract_dist: 20
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_bus: spi1
diag0_pin:^!PG9
interpolate: true
run_current: 1.4
home_current: 0.5
driver_SGT: 1
rref: 12000

[input_shaper]
shaper_freq_x: 112.8
shaper_type_x: mzv
shaper_freq_y: 93.8
shaper_type_y: ei

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
endstop_pin: probe:z_virtual_endstop
position_max: 390
position_min: -5
homing_speed: 16
second_homing_speed: 3
homing_retract_dist: 0

[tmc2240 stepper_z]
cs_pin: PC6
spi_bus: spi1
interpolate: true
run_current: 1.7
rref: 12000
driver_slope_control: 3

[stepper_z1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z1]
cs_pin: PE1
spi_bus: spi1
interpolate: true
run_current: 1.7
rref: 12000
driver_slope_control: 3

[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z2]
cs_pin: PF2
spi_bus: spi1
interpolate: true
run_current: 1.7
rref: 12000
driver_slope_control: 3

[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z3]
cs_pin: PE4
spi_bus: spi1
interpolate: true
run_current: 1.7
rref: 12000
driver_slope_control: 3


#####################################################################
