[printer]
kinematics: corexy
max_velocity: 950  
max_accel: 12000             
max_z_velocity: 200 #220
max_z_accel: 350
square_corner_velocity: 6.0

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.5
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 35

[gcode_preprocessor idle_tool_shutdown]
idle_timeout_minutes: 2
initial_feedrate: 3000

[exclude_object]

[idle_timeout]
timeout: 14400

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_080017000C51313339373836-if00
restart_method: command

[mcu fly]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_380043001057475030383720-if00
restart_method: command

[mcu cartographer] 
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_3B0046000850525537333120-if00
restart_method: command
is_non_critical: true

[mcu hexa]
canbus_uuid: 10e76e7db8a6

[mcu EBB0]
canbus_uuid: 26234199a9b3

[mcu EBB1]
canbus_uuid: d9dac70e68b6

[mcu EBB2]
canbus_uuid: cd88b192997d

[mcu EBB3]
canbus_uuid: d1d0473c408e

[mcu EBB4]
canbus_uuid: 0ad81eb71468

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor Hexa]
sensor_type: temperature_mcu
sensor_mcu: hexa

[temperature_sensor Fly]
sensor_type: temperature_mcu
sensor_mcu: fly

[temperature_sensor Host]
sensor_type: temperature_host

[temperature_sensor EBB0]
sensor_type: temperature_mcu
sensor_mcu: EBB0

[temperature_sensor EBB1]
sensor_type: temperature_mcu
sensor_mcu: EBB1

[temperature_sensor EBB2]
sensor_type: temperature_mcu
sensor_mcu: EBB2

[temperature_sensor EBB3]
sensor_type: temperature_mcu
sensor_mcu: EBB3

[temperature_sensor EBB4]
sensor_type: temperature_mcu
sensor_mcu: EBB4

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[temperature_sensor Motor_Z]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4

[temperature_sensor Motor_Z1]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF5

[temperature_sensor Motor_Z2]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF6

[temperature_sensor Motor_Z3]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF7

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 47
verbose: yes 

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin:!PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 302
position_max: 302
homing_speed: 120
second_homing_speed: 100
homing_retract_dist: 20
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_bus: spi1
diag0_pin:^!PG6
interpolate: true
run_current: 1.4
home_current: 0.5
driver_SGT: 1
rref: 12000

[stepper_y]
step_pin: PG0
dir_pin:!PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200  
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -32
position_endstop: 280
position_max: 280
homing_speed: 120
second_homing_speed: 100
homing_retract_dist: 20
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_bus: spi1
diag0_pin:^!PG9
interpolate: true
run_current: 1.4
home_current: 0.5
driver_SGT: 1
rref: 12000

[input_shaper]
shaper_freq_x: 112.8
shaper_type_x: mzv
shaper_freq_y: 93.8
shaper_type_y: ei

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
endstop_pin: probe:z_virtual_endstop
position_max: 390
position_min: -5
homing_speed: 28
second_homing_speed: 3
homing_retract_dist: 0

[tmc2240 stepper_z]
cs_pin: PC6
spi_bus: spi1
interpolate: true
run_current: 1.8
rref: 12000
driver_slope_control: 3

[stepper_z1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z1]
cs_pin: PE1
spi_bus: spi1
interpolate: true
run_current: 1.8
rref: 12000
driver_slope_control: 3

[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z2]
cs_pin: PF2
spi_bus: spi1
interpolate: true
run_current: 1.8
rref: 12000
driver_slope_control: 3

[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z3]
cs_pin: PE4
spi_bus: spi1
interpolate: true
run_current: 1.8
rref: 12000
driver_slope_control: 3


#####################################################################
# 	TMC Autotune
#####################################################################

[autotune_tmc stepper_x]
motor: moons-ms17hd6p4200
sgt: 1
tuning_goal: performance
voltage: 36
extra_hysteresis: 1
[autotune_tmc stepper_y]
motor: moons-ms17hd6p4200
sgt: 1
tuning_goal: performance
voltage: 36
extra_hysteresis: 1

#####################################################################
# 	Shaketune
#####################################################################

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 140, 20 
#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3 
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 15
max_temp: 130
#control: pid
#pid_kp: 58.072
#pid_ki: 2.375
#pid_kd: 354.962

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################
[safe_z_home]
home_y_before_x: true
home_xy_position:151,140
speed:750
z_hop:5

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
##  Probe points
points:
   25,15
   25,220
   275,220
   275,15
speed: 700
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0055
max_adjust: 5
              
#####################################################################
#   Bed-Mesh
#####################################################################

[bed_mesh]
zero_reference_position: 150, 150
speed: 700
horizontal_move_z: 3
mesh_min: 25, 25
mesh_max: 275, 275
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0

