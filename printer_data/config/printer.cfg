#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3 
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 15
max_temp: 130
#control: pid
#pid_kp: 58.072
#pid_ki: 2.375
#pid_kd: 354.962

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################
[safe_z_home]
home_y_before_x: true
home_xy_position:151,140
speed:500
z_hop:10

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
##  Probe points
points:
   25,15
   25,220
   275,220
   275,15
speed: 600
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0055
max_adjust: 10
              
#####################################################################
#   Bed-Mesh
#####################################################################

[bed_mesh]
zero_reference_position: 150, 150
speed: 600
horizontal_move_z: 3
mesh_min: 25, 25
mesh_max: 275, 275
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
# 	Fan Control
#####################################################################

[controller_fan _Electronics]
pin: PD12
kick_start_time: 1.0
shutdown_speed: 1.0
max_power: 1.0
fan_speed: 0.9
cycle_time: 0.001
idle_timeout: 30
stepper: stepper_z, stepper_x, stepper_y
heater: heater_bed

